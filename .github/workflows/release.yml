name: Release

# Every package is published at the tag's version on every release (lockstep versioning).
# Any failed publish fails the workflow; nothing here may suppress an error (CI greps for it).

on:
  push:
    tags:
      - "v*"
  # Dry run: every build runs, nothing is published. Run it on master before tagging.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every package matches the tag (or, on a dry run, the workspace version)
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          fi
          python scripts/version.py check "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  all-builds:
    name: All builds succeeded
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [pypi-linux, pypi-macos, pypi-windows, pypi-sdist, npm-build]
    steps:
      - run: echo "every artifact built; publishing can start"

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push'
    needs: [verify-version, all-builds]
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth
      # cargo publish waits until each crate is in the index, so the next crate can depend on it.
      - name: Publish outpunch
        run: bash .github/scripts/publish-if-missing.sh crates outpunch "$VERSION" cargo publish -p outpunch
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Publish outpunch-axum
        run: bash .github/scripts/publish-if-missing.sh crates outpunch-axum "$VERSION" cargo publish -p outpunch-axum
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Publish outpunch-client
        run: bash .github/scripts/publish-if-missing.sh crates outpunch-client "$VERSION" cargo publish -p outpunch-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  pypi-linux:
    runs-on: ${{ matrix.platform.runner }}
    # yum inside the manylinux container can take 25+ minutes on a slow AlmaLinux mirror.
    timeout-minutes: 60
    needs: [verify-version]
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13 3.14
          manylinux: manylinux_2_28
          before-script-linux: yum install -y openssl-devel
          working-directory: bindings/python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: bindings/python/dist
          if-no-files-found: error

  pypi-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [verify-version]
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}-apple-darwin
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13 3.14
          working-directory: bindings/python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: bindings/python/dist
          if-no-files-found: error

  pypi-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [verify-version]
    steps:
      - uses: actions/checkout@v4
      # Building for Windows needs every target interpreter installed.
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-pc-windows-msvc
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13 3.14
          working-directory: bindings/python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: bindings/python/dist
          if-no-files-found: error

  pypi-sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify-version]
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: bindings/python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: bindings/python/dist
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push'
    needs: [verify-version, all-builds]
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Check every file is at the release version
        run: |
          for f in dist/*; do
            case "$(basename "$f")" in
              *-"$VERSION"[-.]*) echo "$f" ;;
              *) echo "::error::$f is not at version $VERSION"; exit 1 ;;
            esac
          done
      # PyPI is per file: skip-existing lets a re-run upload only the files a failed run missed.
      # Any other upload error still fails the step.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  npm-build:
    runs-on: ${{ matrix.settings.runner }}
    timeout-minutes: 30
    needs: [verify-version]
    strategy:
      matrix:
        settings:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci --ignore-scripts
      - name: Build native module
        working-directory: bindings/node
        run: npx napi build --platform --release --target ${{ matrix.settings.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.settings.target }}
          path: bindings/node/*.node
          if-no-files-found: error

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push'
    needs: [verify-version, all-builds]
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci --ignore-scripts
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: bindings/node/artifacts
      - name: Move artifacts to platform packages
        working-directory: bindings/node
        run: npx napi artifacts --build-output-dir artifacts
      - name: Check every platform package has its binary
        working-directory: bindings/node
        run: |
          for dir in npm/*/; do
            if ! ls "$dir"*.node >/dev/null 2>&1; then echo "::error::no .node binary in $dir"; exit 1; fi
          done
      - name: Compile the JavaScript entry points
        working-directory: bindings/node
        run: npm run build:js
      - name: Installed package loads through require and import
        working-directory: bindings/node
        run: bash scripts/package-smoke-test.sh npm/linux-x64-gnu
      - name: Pin the platform packages as optional dependencies
        working-directory: bindings/node
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json"));
            const platforms = fs.readdirSync("npm").map((d) => JSON.parse(fs.readFileSync(`npm/${d}/package.json`)).name);
            pkg.optionalDependencies = Object.fromEntries(platforms.map((name) => [name, process.env.VERSION]));
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log(pkg.optionalDependencies);
          '
      - name: Publish platform packages
        working-directory: bindings/node
        run: |
          for dir in npm/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            bash ../../.github/scripts/publish-if-missing.sh npm "$name" "$VERSION" npm publish "$dir" --access public
          done
      - name: Publish main package
        working-directory: bindings/node
        run: bash ../../.github/scripts/publish-if-missing.sh npm outpunch "$VERSION" npm publish --access public --ignore-scripts

  publish-rubygems:
    name: Publish to RubyGems
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push'
    # The native gem compiles against the outpunch crates from crates.io at install time.
    needs: [verify-version, publish-crates]
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Build and publish outpunch-ruby (native gem)
        working-directory: bindings/ruby
        run: |
          # The gem compiles on install, outside this repo: drop the local path
          # dependencies so the outpunch crates resolve from crates.io by version.
          sed -i -E 's/, path = "[^"]*"//' ext/outpunch/Cargo.toml
          if grep -q 'path = ' ext/outpunch/Cargo.toml; then
            echo "::error::path dependency left in ext/outpunch/Cargo.toml" && exit 1
          fi
          gem build outpunch-ruby.gemspec
          bash ../../.github/scripts/publish-if-missing.sh rubygems outpunch-ruby "$VERSION" gem push "outpunch-ruby-$VERSION.gem"
      - name: Build and publish outpunch-ruby-rack
        working-directory: adapters/ruby/rack
        run: |
          gem build outpunch-ruby-rack.gemspec
          bash ../../../.github/scripts/publish-if-missing.sh rubygems outpunch-ruby-rack "$VERSION" gem push "outpunch-ruby-rack-$VERSION.gem"
      - name: Build and publish outpunch-ruby-rails
        working-directory: adapters/ruby/rails
        run: |
          gem build outpunch-ruby-rails.gemspec
          bash ../../../.github/scripts/publish-if-missing.sh rubygems outpunch-ruby-rails "$VERSION" gem push "outpunch-ruby-rails-$VERSION.gem"

  verify-published:
    name: Every package is live on its registry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify-version, publish-crates, publish-pypi, publish-npm, publish-rubygems]
    steps:
      - uses: actions/checkout@v4
      # A registry can accept a publish and take minutes to serve it (npm took ~5 for v0.5.0).
      - run: bash .github/scripts/wait-until-published.sh "${{ needs.verify-version.outputs.version }}" 1200

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs only when every package is live.
    needs: [verify-published]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
