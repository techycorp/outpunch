name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  python-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v4
      - name: Build and test
        working-directory: bindings/python
        run: |
          uv sync --group dev
          uv run pytest tests/ -v

  ruby-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is unsupported for the Ruby gems; see docs/future.md.
        os: [ubuntu-latest, macos-latest]
        ruby-version: ["3.1", "3.2", "3.3"]
    steps:
      - uses: actions/checkout@v4
      # Sets up Ruby plus a Rust toolchain matched to it.
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1.5.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: false
          cargo-cache: false
      # The Rack and Rails adapters load the native gem, so compile it first.
      - name: Build and test outpunch-ruby (native gem)
        working-directory: bindings/ruby
        run: |
          bundle install
          bundle exec rake compile
          bundle exec rspec
      - name: Test outpunch-ruby-rack
        working-directory: adapters/ruby/rack
        run: |
          bundle install
          bundle exec rspec
      - name: Test outpunch-ruby-rails
        working-directory: adapters/ruby/rails
        run: |
          bundle install
          bundle exec rspec

  node-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test
        working-directory: bindings/node
        run: |
          npm ci
          npx napi build --platform
          npx vitest run
