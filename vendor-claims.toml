# Files matching these globs are fakes and must be listed below.
fake_globs = ["crates/*/tests/fakes/*.rs", "adapters/ruby/*/spec/support/fakes/*.rb"]
# Ceiling on unverified claims; it only goes down.
max_unverified = 0

[[fake]]
path = "crates/outpunch-client/tests/fakes/tls_server.rs"
vendor = "public-tls-endpoints"

[[fake.claim]]
behaviour = "a certificate from an untrusted root fails the handshake as an invalid peer certificate"
verified_by = "crates/outpunch-client/tests/vendor_rustls.rs::rustls_must_reject_an_untrusted_root"

[[fake.claim]]
behaviour = "a self-signed certificate fails the handshake as an invalid peer certificate"
verified_by = "crates/outpunch-client/tests/vendor_rustls.rs::rustls_must_reject_a_self_signed_certificate"

[[fake.claim]]
behaviour = "an expired certificate fails the handshake as an invalid peer certificate"
verified_by = "crates/outpunch-client/tests/vendor_rustls.rs::rustls_must_reject_an_expired_certificate"

[[fake.claim]]
behaviour = "a certificate for another host fails the handshake as an invalid peer certificate"
verified_by = "crates/outpunch-client/tests/vendor_rustls.rs::rustls_must_reject_a_certificate_for_another_host"

[[fake.claim]]
behaviour = "a public CA chain validates through system roots"
verified_by = "crates/outpunch-client/tests/vendor_rustls.rs::rustls_must_accept_a_public_ca_chain_through_system_roots"

[[fake.claim]]
behaviour = "a TLS 1.2 only server is accepted"
verified_by = "crates/outpunch-client/tests/vendor_rustls.rs::rustls_must_accept_a_tls_1_2_only_server"

[[fake.claim]]
behaviour = "a TLS 1.0 only server ends the handshake with a TLS alert"
verified_by = "crates/outpunch-client/tests/vendor_rustls.rs::rustls_must_refuse_a_tls_1_0_only_server"

[[fake.claim]]
behaviour = "a TLS 1.1 only server ends the handshake with a TLS alert"
verified_by = "crates/outpunch-client/tests/vendor_rustls.rs::rustls_must_refuse_a_tls_1_1_only_server"

[[fake]]
path = "adapters/ruby/rack/spec/support/fakes/rack_hijack.rb"
vendor = "puma"

[[fake.claim]]
behaviour = "a full hijack returns the client's socket"
verified_by = "adapters/ruby/rack/spec/vendor/puma_hijack_spec.rb::returns the client's socket from a full hijack"

[[fake.claim]]
behaviour = "after a full hijack the server writes nothing of its own, whatever the app returns"
verified_by = "adapters/ruby/rack/spec/vendor/puma_hijack_spec.rb::writes nothing of its own to a fully hijacked socket, whatever the app returns"
