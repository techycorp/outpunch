\* Design model of multiple clients per service (spec/notes/multi-client.md).
\* Safety, 3 connections, symmetry reduction. One message per connection (its auth),
\* so no responses: covers three-way replacement chains, coexistence, eviction and
\* routing; responses are covered by MultiClient.cfg. Expected: no error.
CONSTANTS
    Conns = {c1, c2, c3}
    Services = {s1}
    Reqs = {r1}
    Ids = {i1}
    Tokens = {"right"}
    SecretSet = TRUE
    MaxMsgs = 1
    None = None

SPECIFICATION Spec

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    RoutedOnlyIfAuthed
    EmptySecretRejectsAll
    NoFinishedRegistered
    ResponseFromTarget
    PendingOwnedByTarget
    NoPendingOnFinishedConn
    NoPendingAfterCancel
    ReplaceOnlySameInstance
    OpenImpliesRegistered

CHECK_DEADLOCK FALSE
