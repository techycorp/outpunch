\* 3 connections, 2 services (three-way replacement, cross-service). Safety, symmetry. Expected: no error.
CONSTANTS
    Conns = {c1, c2, c3}
    Services = {s1, s2}
    Reqs = {r1}
    SecretSet = TRUE
    MaxMsgs = 2
    Reconnects = FALSE
    RunDrops = FALSE
    DrainDies = FALSE
    Silences = FALSE
    None = None

SPECIFICATION Spec

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    RoutedOnlyIfAuthed
    EmptySecretRejectsAll
    NoStaleRemoval
    ResponseFromTarget
    PendingOwnedByTarget
    NoPendingOnFinishedConn
    NoPendingAfterCancel
    NoSpuriousNotConnected
    ReplacedIsClosed
    NoTimeoutAfterDisconnect
    NoTimeoutOverResponse

CHECK_DEADLOCK FALSE
