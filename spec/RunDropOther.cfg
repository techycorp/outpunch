\* F3 context: with run() drops and drain deaths, everything else still holds (NoTimeoutAfterDisconnect fails too, F3). Expected: no error.
CONSTANTS
    Conns = {c1, c2}
    Services = {s1}
    Reqs = {r1, r2}
    SecretSet = TRUE
    MaxMsgs = 2
    Reconnects = FALSE
    RunDrops = TRUE
    DrainDies = TRUE
    None = None

SPECIFICATION Spec

INVARIANTS
    TypeOK
    RoutedOnlyIfAuthed
    EmptySecretRejectsAll
    NoStaleRemoval
    ResponseFromTarget
    PendingOwnedByTarget
    NoPendingAfterCancel
    NoSpuriousNotConnected
    ReplacedIsClosed
    NoTimeoutOverResponse

PROPERTIES
    EveryRequestEnds
    NoLeak

CHECK_DEADLOCK FALSE
