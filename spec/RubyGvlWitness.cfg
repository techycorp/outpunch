\* Non-vacuity: every invariant here must be VIOLATED; check-all runs each one separately.
CONSTANTS
    T1 = T1
    T2 = T2
    Kind1 = "push"
    Kind2 = "wait"
    MaxInts = 3
    MaxMsgs = 0
    Variant = "current"
    NoThread = NoThread

SPECIFICATION Spec

INVARIANTS
    NeverAborted
    NeverCancelled
    NeverOk
    NeverRaised
    NeverRetriedThenOk
    NeverSkipped

CHECK_DEADLOCK FALSE
