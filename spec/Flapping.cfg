\* Two eager clients for one service that reconnect forever.
\* Expected: Settles VIOLATED (they keep replacing each other); safety still holds.
CONSTANTS
    Conns = {c1, c2}
    Services = {s1}
    Reqs = {r1}
    SecretSet = TRUE
    MaxMsgs = 1
    Reconnects = TRUE
    RunDrops = FALSE
    DrainDies = FALSE
    None = None

SPECIFICATION FlapSpec

INVARIANTS
    TypeOK
    RoutedOnlyIfAuthed
    EmptySecretRejectsAll
    NoStaleRemoval
    ResponseFromTarget
    PendingOwnedByTarget
    NoPendingOnFinishedConn
    NoPendingAfterCancel
    NoSpuriousNotConnected
    ReplacedIsClosed
    NoTimeoutAfterDisconnect
    NoTimeoutOverResponse

PROPERTIES
    Settles

CHECK_DEADLOCK FALSE
