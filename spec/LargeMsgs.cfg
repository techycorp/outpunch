\* 3 messages per connection (one connection answers both requests, duplicates, junk then response). Safety, symmetry. Expected: no error.
CONSTANTS
    Conns = {c1, c2}
    Services = {s1}
    Reqs = {r1, r2}
    SecretSet = TRUE
    MaxMsgs = 3
    Reconnects = FALSE
    RunDrops = FALSE
    DrainDies = FALSE
    Silences = FALSE
    None = None

SPECIFICATION Spec

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    RoutedOnlyIfAuthed
    EmptySecretRejectsAll
    NoStaleRemoval
    ResponseFromTarget
    PendingOwnedByTarget
    NoPendingOnFinishedConn
    NoPendingAfterCancel
    NoSpuriousNotConnected
    ReplacedIsClosed
    NoTimeoutAfterDisconnect
    NoTimeoutOverResponse

CHECK_DEADLOCK FALSE
