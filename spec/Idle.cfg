\* R30: a client may go silent forever on a half-open socket; the idle timer evicts it. Expected: no error.
CONSTANTS
    Conns = {c1, c2}
    Services = {s1}
    Reqs = {r1}
    SecretSet = TRUE
    MaxMsgs = 2
    Reconnects = FALSE
    RunDrops = FALSE
    DrainDies = FALSE
    Silences = TRUE
    None = None

SPECIFICATION Spec

INVARIANTS
    TypeOK
    RoutedOnlyIfAuthed
    NoStaleRemoval
    ResponseFromTarget
    PendingOwnedByTarget
    NoPendingOnFinishedConn
    NoPendingAfterCancel
    NoSpuriousNotConnected
    ReplacedIsClosed
    NoTimeoutAfterDisconnect
    NoTimeoutOverResponse

PROPERTIES
    SilentUnregistered
    EveryRequestEnds
    NoLeak

CHECK_DEADLOCK FALSE
