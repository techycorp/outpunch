\* Safety and liveness for the server core. Expected: no error. See spec/README.md.
CONSTANTS
    Conns = {c1, c2}
    Services = {s1}
    Reqs = {r1, r2}
    SecretSet = TRUE
    MaxMsgs = 2
    Reconnects = FALSE
    RunDrops = FALSE
    DrainDies = FALSE
    Silences = FALSE
    None = None

SPECIFICATION Spec

INVARIANTS
    TypeOK
    RoutedOnlyIfAuthed
    EmptySecretRejectsAll
    NoStaleRemoval
    ResponseFromTarget
    PendingOwnedByTarget
    NoPendingOnFinishedConn
    NoPendingAfterCancel
    NoSpuriousNotConnected
    ReplacedIsClosed
    NoTimeoutAfterDisconnect
    NoTimeoutOverResponse

PROPERTIES
    EveryRequestEnds
    NoLeak

CHECK_DEADLOCK FALSE
