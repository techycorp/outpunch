\* Design model of multiple clients per service (spec/notes/multi-client.md).
\* Liveness (and safety) on a smaller instance: 1 request, one instance ID plus none.
\* No symmetry (unsound for liveness). Expected: no error.
CONSTANTS
    Conns = {c1, c2}
    Services = {s1}
    Reqs = {r1}
    Ids = {i1}
    Tokens = {"right"}
    SecretSet = TRUE
    MaxMsgs = 2
    None = None

SPECIFICATION Spec

INVARIANTS
    TypeOK
    RoutedOnlyIfAuthed
    EmptySecretRejectsAll
    NoFinishedRegistered
    ResponseFromTarget
    PendingOwnedByTarget
    NoPendingOnFinishedConn
    NoPendingAfterCancel
    ReplaceOnlySameInstance
    OpenImpliesRegistered

PROPERTIES
    EveryRequestEnds
    NoLeak
    DeadEvicted
    DeadUnregistered

CHECK_DEADLOCK FALSE
