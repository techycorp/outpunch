\* Ruby binding, next_outgoing on one thread (plus a push on another): exceptions stop the receive. Expected: no error.
CONSTANTS
    T1 = T1
    T2 = T2
    Kind1 = "recv"
    Kind2 = "push"
    MaxInts = 3
    MaxMsgs = 2
    Variant = "current"
    NoThread = NoThread

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ResultOnlyIfRan
    NoDuplicateOp
    RaisedOnlyByException
    NoEndWithoutResult

PROPERTIES
    EveryCallEnds
    ExceptionStopsCall

CHECK_DEADLOCK FALSE
