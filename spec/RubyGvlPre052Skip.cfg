\* Mutation: before v0.5.2 a skipped call counted as completed. Expected: VIOLATED (ResultOnlyIfRan).
CONSTANTS
    T1 = T1
    T2 = T2
    Kind1 = "push"
    Kind2 = "wait"
    MaxInts = 3
    MaxMsgs = 0
    Variant = "pre052skip"
    NoThread = NoThread

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ResultOnlyIfRan
    NoDuplicateOp
    RaisedOnlyByException
    NoEndWithoutResult

CHECK_DEADLOCK FALSE
