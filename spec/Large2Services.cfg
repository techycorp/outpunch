\* 2 services, 2 requests (isolation across services). Safety, symmetry. Expected: no error.
CONSTANTS
    Conns = {c1, c2}
    Services = {s1, s2}
    Reqs = {r1, r2}
    SecretSet = TRUE
    MaxMsgs = 2
    Reconnects = FALSE
    RunDrops = FALSE
    DrainDies = FALSE
    None = None

SPECIFICATION Spec

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    RoutedOnlyIfAuthed
    EmptySecretRejectsAll
    NoStaleRemoval
    ResponseFromTarget
    PendingOwnedByTarget
    NoPendingOnFinishedConn
    NoPendingAfterCancel
    NoSpuriousNotConnected
    ReplacedIsClosed
    NoTimeoutAfterDisconnect
    NoTimeoutOverResponse

CHECK_DEADLOCK FALSE
