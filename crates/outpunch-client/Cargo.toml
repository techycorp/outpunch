[package]
name = "outpunch-client"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Client library and binary for outpunch reverse WebSocket tunnel"
repository.workspace = true
homepage.workspace = true

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.0", features = ["derive", "env"] }
futures-util = "0.3.32"
outpunch = { workspace = true }
reqwest = { version = "0.13.2", features = ["charset", "json"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
axum = { version = "0.8.8", features = ["ws"] }
outpunch-axum = { path = "../outpunch-axum" }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
