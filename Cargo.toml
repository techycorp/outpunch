[workspace]
resolver = "2"
members = [
    "crates/outpunch",
    "crates/outpunch-axum",
    "crates/outpunch-client",
    "bindings/python",
    "bindings/node",
]

[workspace.package]
version = "0.5.4"
repository = "https://github.com/techycorp/outpunch"
homepage = "https://github.com/techycorp/outpunch"

[workspace.dependencies]
outpunch = { version = "0.5.4", path = "crates/outpunch" }
outpunch-client = { version = "0.5.4", path = "crates/outpunch-client" }
