[package]
name = "outpunch-node"
version.workspace = true
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.8.3", features = ["async", "napi9"] }
napi-derive = "3.5.2"
outpunch = { workspace = true }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }

[build-dependencies]
napi-build = "2.3.1"
